services:
  # -------------------------------------------------------------
  # Backend: FastAPI + LangGraph Agents + ChromaDB
  # -------------------------------------------------------------
  - type: web
    name: defectmind-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        sync: false
        # Set in Render Dashboard to your Supabase PostgreSQL URL:
        # postgresql+asyncpg://postgres:[YOUR-PASSWORD]@db.[YOUR-PROJECT-REF].supabase.co:5432/postgres
      - key: BACKEND_CORS_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app,http://localhost:3000"
      - key: CHROMA_PERSIST_DIR
        value: "./chroma_db"
      - key: RATE_LIMIT_ENABLED
        value: "True"
      - key: SUBMISSION_RATE_LIMIT
        value: "15/minute"
      - key: DEFAULT_RATE_LIMIT
        value: "60/minute"
      - key: OPENAI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # Frontend: Next.js 14 Developer Dashboard (Glassmorphism UI)
  # (Can be hosted here on Render or on Vercel)
  # -------------------------------------------------------------
  - type: web
    name: defectmind-frontend
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: NEXT_PUBLIC_API_URL
        sync: false
        # Set in Render Dashboard to:
        # https://defectmind-backend.onrender.com/api/v1
